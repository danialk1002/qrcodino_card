<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRcodino | کارت ویزیت دیجیتال</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f0ff;
      color: #222;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: white;
      border-radius: 24px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 8px 30px #7b00ff20;
    }

    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 16px;
      border-radius: 22px;
      background: #7B00FF;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: bold;
    }

    h1 {
      color: #7B00FF;
      font-size: 27px;
      margin: 10px 0;
    }

    p {
      line-height: 1.9;
      color: #666;
      font-size: 14px;
    }

    .btn {
      display: block;
      background: #7B00FF;
      color: white;
      padding: 14px;
      margin-top: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    .btn-light {
      background: white;
      color: #7B00FF;
      border: 2px solid #7B00FF;
    }

    footer {
      margin-top: 24px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">QR</div>
    <h1>QRcodino</h1>
    <p>کارت ویزیت دیجیتال دانیال<br>
      ساخت QR Code خلاقانه برای کسب‌وکار شما</p>

    <a class="btn" href="https://instagram.com/qrcodino">
      صفحه اینستاگرام من
    </a>

    <a class="btn btn-light" href="https://instagram.com/qrcodino">
      ارتباط با QRcodino
    </a>

    <footer>طراحی شده با 💜 توسط QRcodino</footer>
  </main>
</body>
</html>
